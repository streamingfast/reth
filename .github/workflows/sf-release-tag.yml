name: Release tag

on:
  pull_request:
    types:
      - closed
    branches:
      - "release/*"
    paths:
      - "CHANGELOG.md"

permissions:
  actions: write
  contents: write

concurrency:
  group: sf-release-tag
  cancel-in-progress: false

env:
  SFRELEASER_VERSION: "v0.17.1-rc.7"

jobs:
  tag:
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install sfreleaser
        run: |
          curl -sSfL "https://github.com/streamingfast/sfreleaser/releases/download/$SFRELEASER_VERSION/sfreleaser_linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" sfreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Detect version
        id: detect
        run: sfreleaser release detect

      - name: Publish release
        if: steps.detect.outputs.is_release_pr
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sfreleaser release publish "$VERSION"

      # A tag created with the GITHUB_TOKEN does not trigger 'sf-release.yml', it is started on the tag instead.
      - name: Start sf-release.yml
        if: steps.detect.outputs.is_release_pr && hashFiles('.github/workflows/sf-release.yml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: gh workflow run sf-release.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
